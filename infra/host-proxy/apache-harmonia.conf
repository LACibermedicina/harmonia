# harmonia.m3d.pro → stack harmonIA em 127.0.0.1:__HTTP_PORT__ (apache já existente no host)
<VirtualHost *:80>
    ServerName harmonia.m3d.pro
    ProxyPreserveHost On
    ProxyRequests Off
    LimitRequestBody 209715200
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/ws/(.*) ws://127.0.0.1:__HTTP_PORT__/ws/$1 [P,L]
    ProxyPass        / http://127.0.0.1:__HTTP_PORT__/ timeout=3600
    ProxyPassReverse / http://127.0.0.1:__HTTP_PORT__/
</VirtualHost>
