# harmonia.m3d.pro → stack harmonIA em 127.0.0.1:__HTTP_PORT__
# Vhost adicionado ao nginx JÁ existente no host (ele é quem escuta 80/443).
# O certbot --nginx acrescenta o bloco 443/TLS e o redirecionamento automaticamente.
map $http_upgrade $harmonia_conn_upgrade { default upgrade; '' close; }

server {
    listen 80;
    listen [::]:80;
    server_name harmonia.m3d.pro;

    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:__HTTP_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $harmonia_conn_upgrade;
        proxy_read_timeout 3600s;
        proxy_request_buffering off;
    }
}
