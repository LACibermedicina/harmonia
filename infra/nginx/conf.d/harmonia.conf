# harmonIA — nginx interno (sem privilégios, porta 8080 no container).
# Publicado só em 127.0.0.1:${HTTP_PORT} no host; o TLS/443 fica com o proxy já existente no servidor.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }
map $http_x_forwarded_proto $fwd_proto { default $http_x_forwarded_proto; '' $scheme; }

# IP real do visitante vindo do proxy do host / túnel
set_real_ip_from 127.0.0.1;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 8080;
    server_name harmonia.m3d.pro _;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "microphone=(self), camera=(self), geolocation=()" always;

    client_max_body_size 200m;   # áudios WAV/FLAC e fotos de partituras
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://api:8000;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://api:8000;
        proxy_read_timeout 300s;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
    location /ws/ {
        proxy_pass http://realtime:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
}
